version: "3.8"

# ai-dash-macOS Docker Compose
# ARM64 only — Apple Silicon native

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    platform: linux/arm64
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g
    extra_hosts:
      - "host.docker.internal:host-gateway"
